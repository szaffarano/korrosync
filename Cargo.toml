[package]
name = "korrosync"
version = "0.4.0"
edition = "2024"
authors = ["Sebastián Zaffarano <sebastian.zaffarano@elastic.co>"]
license = "MIT"
repository = "https://github.com/szaffarano/korrosync"
documentation = "https://docs.rs/korrosync/"
readme = "README.md"
description = "A KOReader Sync Server "

[lib]
path = "./src/lib.rs"

[features]
default = []
tls = ["axum-server/tls-rustls"]

[[bin]]
path = "./src/main.rs"
name = "korrosync"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.6", features = ["http2", "macros", "multipart"] }
clap = { version = "4.6.4", features = ["derive"] }
axum-extra = { version = "0.12.1", features = ["with-rejection"] }
axum-server = "0.8.0"
rkyv = { version = "0.8.17", features = ["alloc", "bytecheck", "unaligned"] }
chrono = "0.4.45"
color-eyre = "0.6.5"
governor = "0.10"
redb = "4.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["trace"] }
tower_governor = "0.8.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
md5 = { package = "md-5", version = "0.11.0" }

[dev-dependencies]
assert_cmd = "2.1.1"
reqwest = "0.13.0"
tokio-retry2 = "0.9.0"
tokio = { version = "1.53.1", features = ["process"] }
tempfile = "3.23.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
serial_test = "3.5.0"
